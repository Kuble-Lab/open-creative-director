name: iOS
on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for iPhone and iPad simulator
        run: |
          xcodebuild -project ios/OpenCreator.xcodeproj -scheme OpenCreator \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
